brain:
  mode: local_llm
  llm_enabled: true
  max_hypotheses_per_cycle: 3
  max_actions_per_cycle: 3
  llm:
    enabled: true
    provider: freetoken_local
    base_url: http://127.0.0.1:8000/v1
    model: auto
    api_key_env: BELTU_LLM_API_KEY
    api_key_required: false
    local_only: true
    use_json_mode: false
    stream: true
    timeout_seconds: 60
    max_tokens: 1800
    temperature: 0.1
    fallback_to_heuristic: true
    max_hypotheses: 3
    max_actions: 3
    system_prompt_path: prompts/llm/system.md
    reasoning_prompt_path: prompts/llm/reasoning.md
    routing:
      enabled: true

    gemini:
      enabled: true
      provider: google_gemini
      api_key_env: GEMINI_API_KEY
      model: gemini-3.8-flash
      base_url: https://generativelanguage.googleapis.com/v1beta
      timeout_seconds: 30
      max_output_tokens: 4096
      max_input_chars: 1500000
      max_observation_chars: 100000
      requests_per_minute: 15
      burst: 1
      retry_after_seconds: 5
      fallback_to_standard: true
      scrub_before_send: true
      allow_final_reports: false
      allow_exploit_payloads: false
      allow_poc_code: false
      allow_session_data: false
      allow_credentials: false

    altar1:
      enabled: false
      base_url: http://127.0.0.1:8101/v1
      model: aikido/altar-1
      api_key_env: BELTU_ALTAR1_API_KEY
      api_key_required: false
      local_only: true
      use_json_mode: false
      stream: true
      timeout_seconds: 180
      max_tokens: 3200
      temperature: 0.1
      activity_dir: data/runtime/altar1.active

execution:
  external_tools_enabled: true

policy:
  high_risk_requires_approval: true

resource_policy:
  cpu_budget_percent: 30
  memory_budget_percent: 30
  gpu_vram_budget_percent: 45
  min_concurrent_processes: 1
  max_concurrent_processes: 2
  poll_interval_seconds: 0.5

retry_policy:
  base_delay_seconds: 0.25
  max_delay_seconds: 5
  jitter: 0

scheduler:
  workers: 4
